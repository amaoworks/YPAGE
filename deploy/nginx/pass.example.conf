server {
    listen 80;
    server_name pass.domain-a.com;
    return 301 https://pass.domain-a.com$request_uri;
}

server {
    listen 443 ssl;
    server_name pass.domain-a.com;

    ssl_certificate     /etc/letsencrypt/live/pass.domain-a.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pass.domain-a.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
