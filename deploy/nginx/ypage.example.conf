server {
    listen 80;
    server_name home.domain-b.com;
    return 301 https://home.domain-b.com$request_uri;
}

server {
    listen 443 ssl;
    server_name home.domain-b.com;

    ssl_certificate     /etc/letsencrypt/live/home.domain-b.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.domain-b.com/privkey.pem;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
